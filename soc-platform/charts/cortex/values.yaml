replicaCount: 1

image:
  repository: strangebee/cortex
  pullPolicy: IfNotPresent
  tag: "3.1.7"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cortex.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

cassandra:
  host: "cassandra.soc.svc.cluster.local"
  port: 9042

elasticsearch:
  host: "elasticsearch"
  port: 9200
  ssl: false
  username: ""
  password: ""

application:
  secret: "changeme-must-be-at-least-64-bytes-long-for-cortex-to-start-properly"

analyzers:
  path: /opt/cortex/analyzers
  respondersPath: /opt/cortex/responders
