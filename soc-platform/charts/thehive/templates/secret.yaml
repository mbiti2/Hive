apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thehive.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "thehive.name" . }}
    helm.sh/chart: {{ include "thehive.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  application-secret: {{ .Values.application.secret | b64enc | quote }}
  {{- if .Values.elasticsearch.password }}
  elasticsearch-password: {{ .Values.elasticsearch.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.cassandra.password }}
  cassandra-password: {{ .Values.cassandra.password | b64enc | quote }}
  {{- end }}
