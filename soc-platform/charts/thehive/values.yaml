replicaCount: 1

image:
  repository: strangebee/thehive
  pullPolicy: IfNotPresent
  tag: "5"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: thehive.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

cassandra:
  host: "cassandra.soc.svc.cluster.local"
  port: 9042
  username: "cassandra"
  password: ""
  # Set local-datacenter to match the Cassandra cluster's datacenter name
  localDatacenter: "datacenter1"

elasticsearch:
  host: "elasticsearch"
  port: 9200
  ssl: false
  username: ""
  password: ""

application:
  secret: "changeme-must-be-at-least-64-bytes-long-for-thehive-to-start-properly"

# For lab environments where the Wazuh indexer uses self-signed certs,
# set acceptAnyCertificate to true to skip SSL verification.
# In production, mount the Wazuh root CA instead.
search:
  acceptAnyCertificate: false
