global:
  security:
    allowInsecureImages: true
image:
  registry: docker.io
  repository: bitnamilegacy/cassandra
dbUser:
  user: cassandra
  password: "cassandra_secret_2026"
replicaCount: 1
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
persistence:
  enabled: true
  size: "5Gi"
jvm:
  maxHeapSize: "512M"
  newHeapSize: "128M"
