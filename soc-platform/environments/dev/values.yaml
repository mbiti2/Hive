# environments/dev/values.yaml

# This file contains overrides for a dev environment.

cassandra:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  persistence:
    enabled: true
    size: "5Gi"
  jvm:
    maxHeapSize: "512M"
    newHeapSize: "128M"

thehive:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  elasticsearch:
    host: wazuh-wazuh-helm-indexer-api.wazuh.svc.cluster.local
    port: 9200
    ssl: true
    username: "admin"
    password: "admin" 
  ingress:
    enabled: true
    className: "traefik"
    hosts:
      - host: thehive.dev.local
        paths:
          - path: /
            pathType: ImplementationSpecific

cortex:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  elasticsearch:
    host: wazuh-wazuh-helm-indexer-api.wazuh.svc.cluster.local
    port: 9200
    ssl: true
    username: "admin"
    password: "admin"
  ingress:
    enabled: true
    className: "traefik"
    hosts:
      - host: cortex.dev.local
        paths:
          - path: /
            pathType: ImplementationSpecific

webhook-adapter:
  replicaCount: 1
  thehive:
    url: "http://thehive:9000"
    apikey: "REPLACE_WITH_THEHIVE_API_KEY"
