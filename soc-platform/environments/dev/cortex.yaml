# environments/dev/cortex.yaml
# Overrides for the Cortex chart in dev environment.
# Values are at top level to match the chart's values.yaml structure.

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"

elasticsearch:
  # We use the existing Wazuh indexer
  host: wazuh-wazuh-helm-indexer-api.wazuh.svc.cluster.local
  port: 9200
  ssl: true
  username: "admin"
  password: "admin"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: cortex.dev.local
      paths:
        - path: /
          pathType: ImplementationSpecific
